<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; }
        .hero { min-height: 100vh; display:flex; align-items:center; justify-content:center; background: #f7f7fb; }
        .card { background:#fff; border:1px solid #eee; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-radius:12px; padding:32px; text-align:center; max-width:420px; }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { color:#555; margin: 0 0 24px; }
        a.button { display:inline-block; padding:12px 18px; background:#0066ff; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; }
        a.button:hover { background:#0052cc; }
    </style>
</head>
<body>
    <div class="hero">
      <div class="card">
        <h1>Welcome to Digital Reception</h1>
        <p>Press Start to enter the app and begin.</p>
        <a class="button" href="app.html">Start</a>
      </div>
    </div>
</body>
</html>
